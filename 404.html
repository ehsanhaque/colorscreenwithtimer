<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="IE=edge" http-equiv="X-UA-Compatible"/>
<title>404 - Page Not Found | Color Screen with Timer</title>
<meta content="Page not found. Return to Color Screen with Timer to use our free fullscreen color display and countdown timer tool." name="description"/>
<meta content="noindex, nofollow" name="robots"/>
<link href="/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
<meta content="#a855f7" name="theme-color"/>
<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-purple-600: #9333ea;
      --color-purple-700: #7e22ce;
      --color-pink-500: #ec4899;
      --color-gray-700: #374151;
      --color-gray-500: #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 2rem;
      padding: 4rem 3rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--color-purple-700) 0%, var(--color-pink-500) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-purple-700);
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.125rem;
      color: var(--color-gray-700);
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-purple-600) 0%, var(--color-pink-500) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: var(--color-purple-700);
      border: 2px solid var(--color-purple-600);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      background: rgba(147, 51, 234, 0.05);
    }

    @media (max-width: 640px) {
      .container {
        padding: 3rem 2rem;
      }

      .error-code {
        font-size: 6rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EKQFWSY642"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-EKQFWSY642');
</script>

</head>
<body>
<div class="container">
<div class="error-code">404</div>
<h1>Page Not Found</h1>
<p>
      Oops! The page you're looking for doesn't exist. It might have been moved or deleted.
    </p>
<div class="actions">
<a class="btn btn-primary" href="/">Go to Homepage</a>
<a class="btn btn-secondary" href="/contact.html">Contact Us</a>
</div>
</div>
</body>
</html>
